<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Live Document WPS Bridge</title><link rel="stylesheet" href="/bridge/panel.css"></head>
<body data-host="wps"><main><h1>Live Document</h1><p>WPS connection bridge — not an AI chat window.</p>
<label for="code">One-time pairing code</label><input id="code" inputmode="numeric" maxlength="8" autocomplete="off" placeholder="livedoc pair">
<div class="actions"><button id="connect">Connect</button><button id="disconnect" disabled>Disconnect</button></div>
<p id="status" role="status">Starting…</p><aside><strong>Security:</strong> paired CLI clients may run arbitrary JavaScript inside this WPS add-in context, including changes to the document. Pair only trusted local sessions.</aside></main>
<script type="module" src="/bridge/panel.js"></script></body></html>
